<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Linus BF Terminal</title>
    <style>
        :root { --primary: #00ff41; --bg: #0d0d0d; --panel: #1a1a1a; --gold: #ffd700; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--primary); font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .container { background: var(--panel); width: 95%; max-width: 500px; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        
        /* Stats */
        .header { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* Terminal */
        .terminal-box { background: #000; border: 1px solid #00ff41; height: 150px; padding: 10px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 10px; box-shadow: inset 0 0 10px rgba(0,255,65,0.2); }
        .input-line { display: flex; background: #000; border: 1px solid #333; padding: 10px; align-items: center; }
        .input-line span { margin-right: 10px; }
        input { background: transparent; border: none; color: var(--primary); font-family: inherit; font-size: 1rem; outline: none; flex: 1; }

        /* Actions */
        .btn-merge { width: 100%; padding: 15px; background: var(--gold); color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .btn-merge:disabled { background: #333; color: #666; }

        /* Inventory */
        .inventory { height: 180px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }
        .item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #222; font-size: 0.75rem; align-items: center; }
        .item-img { width: 25px; height: 25px; object-fit: contain; margin-right: 10px; border-radius: 3px; }

        /* Overlay */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .drop-card { background: #1a1a1a; padding: 30px; border-radius: 15px; text-align: center; border: 2px solid var(--primary); }
        .sell-btn { background: #400; color: #f44; border: 1px solid #f44; padding: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>LOC: <span id="loc" style="color:white">0</span></div>
        <div>MODULES: <span id="count" style="color:white">0</span></div>
    </div>

    <div class="terminal-box" id="termOutput">
        <div>[SYSTEM] Linus Kernel v6.9-rc1</div>
        <div>[SYSTEM] Type Brainfuck code to generate LOC...</div>
    </div>

    <div class="input-line">
        <span>root@kernel:~#</span>
        <input type="text" id="bfInput" placeholder=">+<[.-]" autofocus autocomplete="off">
    </div>

    <button class="btn-merge" id="mergeBtn" onclick="mergePR()" disabled>MERGE PULL REQUEST (100 LOC)</button>

    <div class="inventory" id="inventory"></div>
</div>

<div class="overlay" id="overlay">
    <div class="drop-card" id="dropCard">
        <h2 id="dropName">ITEM</h2>
        <img src="" id="dropImg" style="width:120px; margin-bottom:15px">
        <div style="display:flex; gap:10px">
            <button onclick="keepItem()" style="background:var(--primary); color:black; border:none; padding:10px; flex:1; font-weight:bold; border-radius:5px">MAINLINE</button>
            <button onclick="sellItem()" class="sell-btn">REJECT (-rf)</button>
        </div>
    </div>
</div>

<script>
    let loc = 0;
    let inventory = [];
    const pool = [
        { name: "Minix Driver", color: "#b5b5b5", img: "images(4).jpg", price: 20, chance: 40 },
        { name: "Debian Core", color: "#5e98d9", img: "2Q==(2).jpg", price: 60, chance: 30 },
        { name: "Arch Linux build", color: "#4b69ff", img: "2Q==(1).jpg", price: 150, chance: 18 },
        { name: "Gentoo Experimental", color: "#d32ce6", img: "2Q==(3).jpg", price: 500, chance: 10 },
        { name: "CACHYOS ULTIMATE", color: "#eb4b4b", img: "Z.jpg", price: 2000, chance: 2 }
    ];

    const input = document.getElementById('bfInput');
    const output = document.getElementById('termOutput');

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const code = input.value;
            // Регулярка для проверки символов Brainfuck
            const isBF = /^[+\-<>\[\],.]+$/.test(code);

            if (code.trim() === "") return;

            const line = document.createElement('div');
            if (isBF) {
                loc += 10;
                line.innerHTML = `<span style="color:#888">> ${code}</span> <br> <span style="color:var(--primary)">[OK] Compiled. +10 LOC</span>`;
            } else {
                line.innerHTML = `<span style="color:#888">> ${code}</span> <br> <span style="color:#ff5555">[ERR] Syntax error: Not Brainfuck.</span>`;
            }
            
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
            input.value = "";
            updateUI();
        }
    });

    function updateUI() {
        document.getElementById('loc').innerText = loc;
        document.getElementById('count').innerText = inventory.length;
        document.getElementById('mergeBtn').disabled = loc < 100;
    }

    let currentDrop = null;

    function mergePR() {
        loc -= 100;
        updateUI();
        const rand = Math.random() * 100;
        let cum = 0;
        for(let p of pool) {
            cum += p.chance;
            if(rand <= cum) { currentDrop = p; break; }
        }
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('dropName').innerText = currentDrop.name;
        document.getElementById('dropName').style.color = currentDrop.color;
        document.getElementById('dropImg').src = currentDrop.img;
        document.getElementById('dropCard').style.borderColor = currentDrop.color;
    }

    function keepItem() {
        inventory.unshift({...currentDrop, id: Date.now()});
        document.getElementById('overlay').style.display = 'none';
        renderInventory();
        updateUI();
    }

    function sellItem() {
        loc += currentDrop.price;
        document.getElementById('overlay').style.display = 'none';
        updateUI();
    }

    function deleteItem(id) {
        const idx = inventory.findIndex(i => i.id === id);
        loc += inventory[idx].price;
        inventory.splice(idx, 1);
        renderInventory();
        updateUI();
    }

    function renderInventory() {
        const invEl = document.getElementById('inventory');
        invEl.innerHTML = inventory.map(i => `
            <div class="item">
                <div style="display:flex; align-items:center">
                    <img src="${i.img}" class="item-img">
                    <span style="color:${i.color}">${i.name}</span>
                </div>
                <button class="sell-btn" style="font-size:0.5rem" onclick="deleteItem(${i.id})">RM</button>
            </div>
        `).join('');
    }

    updateUI();
</script>
</body>
</html>
