<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kernel Architect: Linus Edition</title>
    <style>
        :root { --primary: #00ff41; --bg: #0d0d0d; }
        body { background-color: var(--bg); color: var(--primary); font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 20px; object-fit: cover; box-shadow: 0 0 20px rgba(0, 255, 65, 0.3); }
        .btn-start { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 15px 40px; font-size: 1rem; font-weight: bold; text-decoration: none; border-radius: 5px; transition: 0.3s; }
        .btn-start:hover { background: var(--primary); color: #000; }
    </style>
</head>
<body>
    <img src="1000045055.jpg" alt="Linus" class="avatar">
    <div style="margin-bottom: 20px;">LINUS TORVALD SIMULATOR.</div>
    <a href="game.html" class="btn-start">BOOT KERNEL</a>
</body>
</html>
